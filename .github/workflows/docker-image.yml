name: Build and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  # GitHub repo owner must be lowercase for GHCR
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/borsibaar

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Validate — runs on every push and PR
  # ──────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ── Backend checks ──
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # TODO: Add checkstyle or spotless plugin to pom.xml, then uncomment:
      # - name: Check backend formatting
      #   working-directory: backend
      #   run: ./mvnw spotless:check

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw clean verify

      # ── Frontend checks ──
      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # TODO: Uncomment when you have frontend tests
      # - name: Test frontend
      #   working-directory: frontend
      #   run: npm run test

      - name: Build frontend (verify it compiles)
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: https://borsibaar.ee
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 2: Build & push Docker images — main only
  # ──────────────────────────────────────────────
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build backend image (push only on main) ──
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ── Build frontend image (push only on main) ──
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://borsibaar.ee
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ──────────────────────────────────────────────
  # Job 3: Deploy to server — after images are pushed
  # ──────────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production  # Optional: add manual approval in GitHub settings
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Copy only what the server needs: compose file + Caddyfile
          scp -i ~/.ssh/id_rsa \
            docker-compose.yml \
            Caddyfile \
            "$SSH_USER@$SERVER_IP:$DEPLOY_PATH/"

          ssh -i ~/.ssh/id_rsa "$SSH_USER@$SERVER_IP" << DEPLOY
          set -e
          cd $DEPLOY_PATH

          echo "▸ Pulling new images..."
          docker compose pull backend frontend

          echo "▸ Restarting services..."
          docker compose up -d --no-build

          echo "▸ Cleaning up old images..."
          docker image prune -f

          echo "▸ Current status:"
          docker compose ps

          echo "▸ Waiting 10s for health check..."
          sleep 10
          if docker compose ps | grep -q "unhealthy\|Exit"; then
            echo "⚠ WARNING: Some services may be unhealthy!"
            docker compose logs --tail=30
            exit 1
          fi
          echo "✓ Deployment complete!"
          DEPLOY